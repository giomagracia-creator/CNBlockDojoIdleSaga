<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/ui/settings.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensei · Block Dojo</title>
  </head>
  <body class="sensei-body">
    <main id="sensei">
      <p class="eyebrow">SENSEI PORTAL</p>
      <h1>Class of 16</h1>
      <p class="lede">Steer the pumpkin patch on Dojo TV. Jobs, locks, and the meteor live here.</p>
      <div class="sensei-bar">
        <button class="pix-btn" id="btn-meteor" type="button"><span>DROP METEOR</span></button>
        <button class="pix-btn ghost" id="btn-farm-all" type="button"><span>ALL FARM</span></button>
        <button class="pix-btn ghost" id="btn-mine-all" type="button"><span>ALL MINE</span></button>
        <a class="pix-btn ghost" href="/?tv=1"><span>OPEN TV</span></a>
      </div>
      <p class="note" id="sensei-note">Portal ready.</p>
      <section id="roster" class="roster"></section>
    </main>
    <script type="module" src="/src/sensei.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/ui/play.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Block Dojo</title>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="overlay" hidden>
        <header id="hud">
          <div class="hud-left">
            <span class="chip gold" id="gold-chip"><span class="dot"></span><span id="gold-count">0</span></span>
            <span class="chip lv" id="lv-chip">LV <span id="lv-count">1</span></span>
          </div>
          <div class="hud-xp">
            <div class="xp-track"><div id="xp-fill"></div></div>
            <span id="xp-label">0 / 48 XP</span>
          </div>
          <div class="hud-right">
            <span class="chip hp" id="hp-chip">HP <span id="hp-count">20</span></span>
            <button class="icon-btn" id="btn-menu" type="button" hidden aria-label="Open scroll">
              <img src="/assets/ui/levels.png" alt="" />
            </button>
          </div>
        </header>

        <section id="title-card" class="card">
          <p class="eyebrow">ADVENTURE RPG</p>
          <h1>BLOCK DOJO</h1>
          <p class="lede">
            Sit on the mat. Fruit heals. Crates pay coins. Monsters grant experience.
            Level-ups open tribute chests. You only seal changes on the scroll.
          </p>
          <div class="title-actions">
            <button class="pix-btn" id="btn-play" type="button">
              <img src="/assets/ui/play.png" alt="" />
              <span>WATCH</span>
            </button>
            <button class="pix-btn ghost" id="btn-title-settings" type="button">
              <img src="/assets/ui/settings.png" alt="" />
              <span>SCROLL</span>
            </button>
          </div>
        </section>

        <section id="menu-card" class="card float-card" hidden>
          <div class="card-head">
            <div>
              <p class="eyebrow" id="card-rank">Novice</p>
              <h2 id="card-title">Dojo Scroll</h2>
            </div>
            <button class="icon-btn" id="btn-card-close" type="button" aria-label="Close">
              <img src="/assets/ui/close.png" alt="" />
            </button>
          </div>
          <nav id="card-tabs" class="card-tabs">
            <button data-panel="scroll" type="button" class="active">Scroll</button>
            <button data-panel="workshop" type="button">Workshop</button>
            <button data-panel="heroes" type="button">Heroes</button>
            <button data-panel="routes" type="button">Routes</button>
            <button data-panel="settings" type="button">Sound</button>
          </nav>
          <div id="card-body" class="card-body"></div>
          <footer class="card-foot">
            <p id="draft-note" class="note">No unsealed changes.</p>
            <button class="pix-btn" id="btn-apply" type="button" disabled>
              <img src="/assets/ui/play.png" alt="" />
              <span>APPLY</span>
            </button>
          </footer>
        </section>

        <section id="loot-card" class="card float-card loot-card" hidden>
          <p class="eyebrow">LEVEL UP</p>
          <h2 id="loot-title">Tribute opened</h2>
          <div id="loot-stage" class="loot-stage">
            <img id="loot-chest" src="/assets/items/box1/break.png" alt="" />
          </div>
          <div id="loot-haul" class="loot-haul"></div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
